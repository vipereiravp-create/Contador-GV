<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Gentlemen Bikers - Contagem Regressiva</title>
    <style>
        @font-face {
            font-family: 'Romantiques';
            src: url('Romantiques.ttf') format('truetype'),
                 url('Romantiques.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            letter-spacing: 0.05em;
        }

        .background-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85vw;
            max-width: 480px;
            max-height: 70vh;
            max-height: 70dvh;
            object-fit: contain;
            opacity: 0.20;
            filter: grayscale(100%) contrast(140%);
            z-index: 1;
            pointer-events: none;
            animation: pulseLogo 4s ease-in-out infinite;
        }

        @keyframes pulseLogo {
            0%, 100% {
                transform: translate(-50%, -50%) scale(0.96);
                opacity: 0.15;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
                opacity: 0.25;
            }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            max-width: 90%;
            width: 400px;
        }

        h1 {
            font-family: 'Romantiques', 'Arial Black', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            border-bottom: 1px solid #ffffff;
            padding-bottom: 10px;
            font-weight: normal;
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.15);
        }

        .counter-box {
            margin: 20px 0;
        }

        .days-number {
            font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            text-shadow: 3px 3px 0 rgba(255, 255, 255, 0.12);
        }

        .days-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 5px;
            color: #d9d9d9;
            font-weight: 700;
        }

        .footer-text {
            font-size: 0.75rem;
            color: #888888;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        .admin-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.6);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-button:hover {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.85);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .admin-panel {
            position: fixed;
            top: 65px;
            right: 20px;
            width: min(360px, calc(100vw - 40px));
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.96) 0%, rgba(15, 15, 15, 0.96) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 24px;
            z-index: 19;
            display: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .admin-panel.visible {
            display: block;
            animation: slideInPanel 0.3s ease-out;
        }

        @keyframes slideInPanel {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .admin-panel h2 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 900;
        }

        .admin-form {
            display: grid;
            gap: 12px;
        }

        .admin-form input,
        .admin-form button {
            width: 100%;
            padding: 11px 14px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-family: 'Impact', 'Arial Black', 'Segoe UI', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            transition: all 0.2s ease;
        }

        .admin-form input[type="text"],
        .admin-form input[type="password"],
        .admin-form input[type="date"],
        .admin-form input[type="file"] {
            min-width: 0;
        }

        .admin-form input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.4);
            outline: none;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        .admin-form button {
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.08) 100%);
            color: #ffffff;
            font-weight: bold;
            border-color: rgba(255, 255, 255, 0.25);
            transition: all 0.2s ease;
        }

        .admin-form button:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.12) 100%);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .admin-form button:active {
            transform: scale(0.98);
        }

        .admin-message {
            min-height: 20px;
            margin-top: 12px;
            font-size: 0.76rem;
            color: #a8f0c2;
            letter-spacing: 0.5px;
        }

        .sync-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 5;
        }

        .sync-indicator.synced {
            color: #a8f0c2;
            border-color: rgba(168, 240, 194, 0.3);
        }

        @media (max-width: 600px) {
            body {
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 50px 16px 20px 16px;
                overflow-y: auto;
                min-height: 100dvh;
            }

            .background-logo {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                width: 150px;
                max-width: 45vw;
                max-height: 180px;
                object-fit: contain;
                margin: 0 auto 16px auto;
                opacity: 0.90;
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.25));
                animation: pulseLogoMobile 4s ease-in-out infinite;
            }

            @keyframes pulseLogoMobile {
                0%, 100% {
                    transform: scale(0.96);
                    opacity: 0.82;
                }
                50% {
                    transform: scale(1.04);
                    opacity: 1.0;
                }
            }

            .container {
                width: 100%;
                max-width: 360px;
            }

            .days-number {
                font-size: 3.8rem;
            }

            h1 {
                font-size: 1.05rem;
                letter-spacing: 1.5px;
            }

            .admin-button {
                top: 12px;
                right: 12px;
                padding: 7px 10px;
                font-size: 0.65rem;
            }

            .admin-panel {
                top: 54px;
                right: 12px;
                width: calc(100vw - 24px);
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <img id="backgroundLogo" src="imagem1.png" alt="Brasão Old Gentlemen Bikers" class="background-logo">

    <button class="admin-button" id="adminToggle" type="button">Admin</button>

    <div class="sync-indicator" id="syncIndicator">Conectando...</div>

    <div class="admin-panel" id="adminPanel" aria-live="polite">
        <h2>Admin</h2>

        <form id="loginForm" class="admin-form">
            <input type="text" id="username" placeholder="Usuário" autocomplete="username" required>
            <input type="password" id="password" placeholder="Senha" autocomplete="current-password" required>
            <button type="submit">Acessar</button>
        </form>

        <form id="configForm" class="admin-form" style="display: none; margin-top: 12px;">
            <label style="text-align:left; font-size:0.7rem; letter-spacing:1px; color:rgba(255,255,255,0.6); text-transform:uppercase; display:block; margin-bottom:6px;">Título do evento</label>
            <input type="text" id="counterTitle" maxlength="60" placeholder="Digite o título">

            <label style="text-align:left; font-size:0.7rem; letter-spacing:1px; color:rgba(255,255,255,0.6); text-transform:uppercase; display:block; margin-bottom:6px; margin-top:6px;">Data do evento</label>
            <input type="date" id="eventDate" required>

            <label style="text-align:left; font-size:0.7rem; letter-spacing:1px; color:rgba(255,255,255,0.6); text-transform:uppercase; display:block; margin-bottom:6px; margin-top:6px;">Imagem de fundo (padrão)</label>
            <div style="color:#a8f0c2; font-size:0.85rem;">Imagem fixa: <strong>imagem1.png</strong></div>

            <button type="submit" style="margin-top:6px;">Salvar alterações</button>
            <button type="button" id="logoutBtn" style="background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.7);">Sair</button>
            <button type="button" id="shareBtn" style="background: rgba(168, 240, 194, 0.15); border-color: rgba(168, 240, 194, 0.3); color: #a8f0c2; margin-top: 6px;">📤 Sincronizar config</button>
        </form>

        <div class="admin-message" id="adminMessage"></div>
    </div>

    <div class="container">
        <h1 id="counterTitleDisplay">Próximo Rolê / Evento</h1>
        <div class="counter-box">
            <div class="days-number" id="days" aria-live="polite">--</div>
            <div class="days-label">Dias Restantes</div>
        </div>
    </div>

    <script>
        // Configuração global compartilhada
        const CONFIG_URL = 'https://vipereiravp-create.github.io/Contador-GV/config.json';
        
        const STORAGE_KEYS = {
            date: 'ogb-event-date',
            background: 'ogb-event-background',
            title: 'ogb-event-title',
            lastSync: 'ogb-last-sync'
        };

        const ADMIN_USER = 'admin';
        const ADMIN_PASSWORD = 'q2l9w5n8';

        // Sincronizar configurações a cada 5 segundos
        let isSyncing = false;
        async function syncConfigFromCloud() {
            if (isSyncing) return;
            isSyncing = true;
            try {
                const response = await fetch(CONFIG_URL + '?t=' + Date.now(), { cache: 'no-store' });
                if (response.ok) {
                    const config = await response.json();
                    const lastSync = localStorage.getItem(STORAGE_KEYS.lastSync);
                    const configTime = new Date(config.lastUpdated).getTime();
                    const lastSyncTime = lastSync ? parseInt(lastSync) : 0;
                    
                    // Se config na nuvem é mais recente, atualiza localmente
                    if (configTime > lastSyncTime) {
                        localStorage.setItem(STORAGE_KEYS.title, config.title || 'Próximo Rolê / Evento');
                        localStorage.setItem(STORAGE_KEYS.date, config.date || '2026-12-31');
                        localStorage.setItem(STORAGE_KEYS.lastSync, configTime.toString());
                        
                        // Sincroniza background se existir
                        if (config.background) {
                            localStorage.setItem(STORAGE_KEYS.background, config.background);
                            backgroundLogo.src = config.background;
                        }
                        
                        // Recarrega a exibição
                        counterTitleDisplay.textContent = config.title || 'Próximo Rolê / Evento';
                        eventDateInput.value = config.date || '2026-12-31';
                        counterTitleInput.value = config.title || 'Próximo Rolê / Evento';
                        targetDate = new Date((config.date || '2026-12-31') + 'T00:00:00');
                        updateCountdown();
                    }
                    
                    syncIndicator.textContent = '✓ Sincronizado';
                    syncIndicator.classList.add('synced');
                }
            } catch (error) {
                syncIndicator.textContent = '◯ Modo local';
                syncIndicator.classList.remove('synced');
            }
            isSyncing = false;
        }

        function exportConfigAsJSON() {
            const config = {
                title: counterTitleInput.value || 'Próximo Rolê / Evento',
                date: eventDateInput.value || '2026-12-31',
                background: localStorage.getItem(STORAGE_KEYS.background) || 'imagem1.png',
                lastUpdated: new Date().toISOString()
            };
            return JSON.stringify(config, null, 2);
        }

        function generateShareLink() {
            const title = encodeURIComponent(counterTitleInput.value || 'Próximo Rolê / Evento');
            const date = eventDateInput.value || '2026-12-31';
            const shareLink = `https://vipereiravp-create.github.io/Contador-GV/?title=${title}&date=${date}`;
            
            // Copiar para clipboard
            navigator.clipboard.writeText(shareLink).then(() => {
                setMessage('✓ Link copiado! Compartilhe com seus amigos.');
            }).catch(() => {
                const message = `📤 Copie este link:\n\n${shareLink}`;
                alert(message);
            });

            // Gerar config.json com imagem para copiar
            const config = {
                title: counterTitleInput.value || 'Próximo Rolê / Evento',
                date: eventDateInput.value || '2026-12-31',
                background: localStorage.getItem(STORAGE_KEYS.background) || 'imagem1.png',
                lastUpdated: new Date().toISOString(),
                version: 1
            };
            
            // Copiar também o JSON da config
            const jsonText = JSON.stringify(config, null, 2);
            console.log('📋 Cole este config.json na sua pasta:');
            console.log(jsonText);
        }

        function loadConfigFromURL() {
            const params = new URLSearchParams(window.location.search);
            const titleParam = params.get('title');
            const dateParam = params.get('date');
            const bgParam = params.get('bg');
            
            if (titleParam) {
                const decodedTitle = decodeURIComponent(titleParam);
                localStorage.setItem(STORAGE_KEYS.title, decodedTitle);
                counterTitleDisplay.textContent = decodedTitle;
                counterTitleInput.value = decodedTitle;
            }
            
            if (dateParam) {
                localStorage.setItem(STORAGE_KEYS.date, dateParam);
                eventDateInput.value = dateParam;
                targetDate = new Date(dateParam + 'T00:00:00');
                updateCountdown();
            }

            if (bgParam) {
                try {
                    const decodedBg = decodeURIComponent(bgParam);
                    localStorage.setItem(STORAGE_KEYS.background, decodedBg);
                    backgroundLogo.src = decodedBg;
                } catch (e) {
                    console.log('Background parameter decode error');
                }
            }
        }

        function showExportModal() {
            const configJSON = exportConfigAsJSON();
            const message = `📋 Configuração pronta para compartilhar:\n\n${configJSON}\n\nCopie este JSON e atualize o arquivo config.json no repositório para que todos vejam as alterações.`;
            alert(message);
        }

        const adminToggle = document.getElementById('adminToggle');
        const adminPanel = document.getElementById('adminPanel');
        const loginForm = document.getElementById('loginForm');
        const configForm = document.getElementById('configForm');
        const adminMessage = document.getElementById('adminMessage');
        const backgroundLogo = document.getElementById('backgroundLogo');
        const counterTitleDisplay = document.getElementById('counterTitleDisplay');
        const counterTitleInput = document.getElementById('counterTitle');
        const eventDateInput = document.getElementById('eventDate');
        // backgroundFileInput removed; background is fixed to imagem1.png by default
        const logoutBtn = document.getElementById('logoutBtn');
        const syncIndicator = document.getElementById('syncIndicator');

        let targetDate = new Date('2026-12-31T00:00:00');

        function setMessage(message, isError = false) {
            adminMessage.textContent = message;
            adminMessage.style.color = isError ? '#ffb0b0' : '#a8f0c2';
        }

        function applyStoredOptions() {
            const savedDate = localStorage.getItem(STORAGE_KEYS.date);
            const savedBackground = localStorage.getItem(STORAGE_KEYS.background);
            const savedTitle = localStorage.getItem(STORAGE_KEYS.title) || 'Próximo Rolê / Evento';

            counterTitleDisplay.textContent = savedTitle;
            counterTitleInput.value = savedTitle;

            if (savedDate) {
                targetDate = new Date(savedDate + 'T00:00:00');
                eventDateInput.value = savedDate;
            } else {
                eventDateInput.value = '2026-12-31';
            }

            if (savedBackground && savedBackground !== 'brasao.svg') {
                backgroundLogo.src = savedBackground;
            } else {
                // Garantir imagem padrão embutida (imagem1.png)
                backgroundLogo.src = 'imagem1.png';
                localStorage.setItem(STORAGE_KEYS.background, 'imagem1.png');
            }
        }

        function updateCountdown() {
            const now = new Date();
            const difference = targetDate - now;

            if (difference > 0) {
                const daysLeft = Math.ceil(difference / (1000 * 60 * 60 * 24));
                document.getElementById('days').innerText = daysLeft;
                document.querySelector('.days-label').innerText = 'Dias Restantes';
            } else {
                document.getElementById('days').innerText = '0';
                document.querySelector('.days-label').innerText = 'Evento Iniciado!';
            }
        }

        function togglePanel() {
            adminPanel.classList.toggle('visible');
        }

        function showConfigPanel() {
            loginForm.style.display = 'none';
            configForm.style.display = 'grid';
            setMessage('Acesso liberado para configurar o evento.');
        }

        function showLoginPanel() {
            loginForm.style.display = 'grid';
            configForm.style.display = 'none';
            setMessage('');
        }

        // Upload e compressão de imagem removidos: a imagem de fundo é fixa (brasao.svg)

        adminToggle.addEventListener('click', togglePanel);

        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (username === ADMIN_USER && password === ADMIN_PASSWORD) {
                showConfigPanel();
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            } else {
                setMessage('Usuário ou senha incorretos.', true);
            }
        });

        configForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const titleValue = counterTitleInput.value.trim();
            const selectedDate = eventDateInput.value;
            if (!selectedDate) {
                setMessage('Selecione uma data válida.', true);
                return;
            }

            const finalTitle = titleValue || 'Próximo Rolê / Evento';
            counterTitleDisplay.textContent = finalTitle;
            localStorage.setItem(STORAGE_KEYS.title, finalTitle);

            targetDate = new Date(selectedDate + 'T00:00:00');
            localStorage.setItem(STORAGE_KEYS.date, selectedDate);

            // Upload de imagem desabilitado — mantendo background padrão

            updateCountdown();
            setMessage('Dados do evento salvos com sucesso.');
        });

        logoutBtn.addEventListener('click', function () {
            showLoginPanel();
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            adminPanel.classList.add('visible');
        });

        document.getElementById('shareBtn').addEventListener('click', generateShareLink);

        // Sincronizar ao carregar
        window.addEventListener('load', function() {
            syncConfigFromCloud();
            loadConfigFromURL();
        });
        // Sincronizar periodicamente
        setInterval(syncConfigFromCloud, 5000);

        applyStoredOptions();
        updateCountdown();
        setInterval(updateCountdown, 60000);
    </script>
</body>
</html>
